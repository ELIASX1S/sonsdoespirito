name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar página para produção
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('https://sonsdoespirito.store/', 'https://sonsdoespirito.online/')
          html = html.replace('assets/capa-devocional.png', 'assets/capa-devocional.svg')
          html = html.replace('clamp(2.6rem,5.2vw,5.35rem)', 'clamp(2.6rem,4.7vw,4.85rem)')
          html = html.replace('"price":"27.00"', '"price":"29.90"')
          html = html.replace('<strong>27</strong><span>,00</span>', '<strong>29</strong><span>,90</span>')
          html = html.replace('R$ 27,00', 'R$ 29,90')

          pixel = '''
          <!-- Meta Pixel Code -->
          <script>
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', '525823787068613');
            fbq('track', 'PageView');
          </script>
          <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=525823787068613&ev=PageView&noscript=1"
            alt=""></noscript>
          <!-- End Meta Pixel Code -->
          '''

          if '525823787068613' not in html:
              html = html.replace('</head>', pixel + '\n</head>')

          path.write_text(html, encoding='utf-8')
          PY
          touch .nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
